name: Build

on:
    push:
    pull_request:
    workflow_call:

permissions:
    contents: read

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { runner: windows-2025, target: windows-x64, arch: x64 }
                    - { runner: windows-11-arm, target: windows-arm64, arch: ARM64 }
                    - { runner: ubuntu-22.04, target: linux-x64, platform: linux/amd64 }
                    - { runner: ubuntu-22.04-arm, target: linux-arm64, platform: linux/arm64 }
                    - { runner: macos-26-intel, target: macos-x64 }
                    - { runner: macos-26, target: macos-arm64 }

        runs-on: ${{ matrix.runner }}

        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Set up Docker Buildx
              if: runner.os == 'Linux'
              uses: docker/setup-buildx-action@v3

            - name: Build Windows
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  cmake -S . -B build -A ${{ matrix.arch }} -DCMAKE_BUILD_TYPE=MinSizeRel
                  cmake --build build --config MinSizeRel
                  New-Item -ItemType Directory -Force artifact | Out-Null
                  Copy-Item build/MinSizeRel/vencord-rpc.exe "artifact/vencord-rpc-${{ matrix.target }}.exe"

            - name: Build macOS
              if: runner.os == 'macOS'
              run: |
                  cmake -S . -B build -DCMAKE_BUILD_TYPE=MinSizeRel
                  cmake --build build --parallel
                  mkdir -p artifact
                  cp build/vencord-rpc "artifact/vencord-rpc-${{ matrix.target }}"

            - name: Build Linux
              if: runner.os == 'Linux'
              run: |
                  sh ./scripts/build-linux.sh ${{ matrix.platform }}
                  mkdir -p artifact
                  cp dist/vencord-rpc "artifact/vencord-rpc-${{ matrix.target }}"
                  chmod +x "artifact/vencord-rpc-${{ matrix.target }}"

            - uses: actions/upload-artifact@v4
              with:
                  name: vencord-rpc-${{ matrix.target }}
                  path: artifact/*
                  if-no-files-found: error
